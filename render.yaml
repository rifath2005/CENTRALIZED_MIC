services:
  # 1. Token Service (Node.js/Express)
  - type: web
    name: centralized-mic-token-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: TOKEN_TTL
        value: "3600"

  # 2. Host Receiver Web Application (React / Web Audio)
  - type: static
    name: centralized-mic-receiver
    rootDir: host
    buildCommand: npm install && npm run build
    staticPublishPath: dist
